<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Erreur 500 - PAYsible</title>
    <style>
        /* =========================================
           CHARTE GRAPHIQUE PAYSIBLE (Isolée)
           ========================================= */
        :root {
            --pay-dark-blue: #1D3D6A;   /* Bleu Foncé */
            --pay-light-blue: #38A5E4;  /* Turquoise Clair */
            --pay-mid-blue: #2474C6;    /* Bleu Moyen */
            --pay-gold: #F4C448;        /* Or/Jaune */
            --pay-white: #FFFFFF;
        }

        body.error-page-body {
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 400;
            overflow: hidden;
            background-color: #f8f9fa; /* Fond très clair */
            color: var(--pay-dark-blue);
        }

        .container-error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            transition: transform .5s;
        }

        /* --- STYLES DES CARTES (TERMINAUX) --- */
        .writing {
            width: 320px;
            height: 200px;
            background-color: var(--pay-dark-blue); /* Fond terminal en Bleu Foncé */
            border: 1px solid var(--pay-mid-blue);
            border-radius: 6px 6px 4px 4px;
            position: relative;
            box-shadow: 0 10px 30px rgba(29, 61, 106, 0.4);
        }

        .writing .topbar {
            position: absolute;
            width: 100%;
            height: 20px; /* Un peu plus haut pour le style */
            background-color: var(--pay-mid-blue); /* Barre en Bleu Moyen */
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            display: flex;
            align-items: center;
            padding-left: 6px;
        }

        .writing .topbar div {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            margin: 3px;
            float: left;
        }

        /* Boutons de la fenêtre aux couleurs PAYsible ou neutres */
        .writing .topbar div.green { background-color: var(--pay-light-blue); }
        .writing .topbar div.red   { background-color: var(--pay-gold); } /* Or pour l'accent */
        .writing .topbar div.yellow{ background-color: var(--pay-white); opacity: 0.5; }

        .writing .code {
            padding: 15px;
            margin-top: 15px;
        }

        .writing .code ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .writing .code ul li {
            background-color: var(--pay-light-blue); /* Lignes de code en Turquoise */
            width: 0;
            height: 7px;
            border-radius: 6px;
            margin: 10px 0;
            opacity: 0.8;
        }
        
        /* Une ligne sur deux en Or pour varier */
        .writing .code ul li:nth-child(even) {
            background-color: var(--pay-gold);
        }

        .stack-container {
            position: relative;
            width: 420px;
            height: 210px;
            transition: width 1s, height 1s;
        }

        .pokeup {
            transition: all .3s ease;
        }

        .pokeup:hover {
            transform: translateY(-10px);
        }

        /* --- TEXTE ET TITRES --- */
        .error-text {
            width: 400px;
            padding: 40px;
            text-align: center;
            z-index: 10;
        }

        .error-text h1 {
            font-size: 125px;
            padding: 0;
            margin: 0;
            font-weight: 800;
            color: var(--pay-dark-blue);
            line-height: 1;
            text-shadow: 2px 2px 0px var(--pay-light-blue);
        }

        .error-text h2 {
            margin: -20px 0 0 0;
            padding: 0px;
            font-size: 47px;
            letter-spacing: 5px;
            color: var(--pay-mid-blue);
            text-transform: uppercase;
        }
        
        .error-text p {
            color: #6c757d;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        /* --- BOUTON RETOUR --- */
        .btn-home {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            /* Dégradé PAYsible */
            background: linear-gradient(135deg, var(--pay-dark-blue) 0%, var(--pay-mid-blue) 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(29, 61, 106, 0.3);
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(36, 116, 198, 0.4);
            /* Inversement subtil du dégradé ou éclaircissement */
            background: linear-gradient(135deg, var(--pay-mid-blue) 0%, var(--pay-light-blue) 100%);
        }

        /* --- ANIMATIONS --- */
        .perspec {
            perspective: 1000px;
        }

        .writeLine {
            animation: writeLine .4s linear forwards;
        }

        .explode {
            animation: explode .5s ease-in-out forwards;
        }

        .card {
            animation: tiltcard .5s ease-in-out 1s forwards;
            position: absolute;
        }

        @keyframes tiltcard {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-30deg); }
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(var(--spreaddist), var(--vertdist)) scale(var(--scaledist)); }
        }

        @keyframes writeLine {
            0% { width: 0; }
            100% { width: var(--linelength); }
        }

        @media screen and (max-width: 1000px) {
            .container-error { transform: scale(.85); flex-direction: column; }
            .stack-container { margin-top: 50px; }
        }
    </style>
</head>
<body class="error-page-body">

    <div class="container-error">
        <div class="error-text">
            <h1>500</h1>
            <h2>ERREUR</h2>
            <p>Oups ! Nos serveurs ont eu un petit bug. L'équipe technique est sur le coup.</p>
            <a href="/" class="btn-home">Retour à l'accueil</a>
        </div>
        
        <div class="stack-container">
            <div class="card-container">
                <div class="perspec" style="--spreaddist: 75px; --scaledist: .85; --vertdist: -15px;">
                    <div class="card">
                        <div class="writing">
                            <div class="topbar">
                                <div class="red"></div><div class="yellow"></div><div class="green"></div>
                            </div>
                            <div class="code"><ul></ul></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-container">
                <div class="perspec" style="--spreaddist: 0px; --scaledist: 1; --vertdist: 0px;">
                    <div class="card">
                        <div class="writing">
                            <div class="topbar">
                                <div class="red"></div><div class="yellow"></div><div class="green"></div>
                            </div>
                            <div class="code"><ul></ul></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Le même script d'animation que précédemment
        const stackContainer = document.querySelector('.stack-container');
        const cardNodes = document.querySelectorAll('.card-container');
        const perspecNodes = document.querySelectorAll('.perspec');
        const perspec = document.querySelector('.perspec');
        const card = document.querySelector('.card');

        let counter = stackContainer.children.length;

        function randomIntFromInterval(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        if(card) {
            card.addEventListener('animationend', function () {
                perspecNodes.forEach(function (elem, index) {
                    elem.classList.add('explode');
                });
            });
        }

        if(perspec) {
            perspec.addEventListener('animationend', function (e) {
                if (e.animationName === 'explode') {
                    cardNodes.forEach(function (elem, index) {
                        elem.classList.add('pokeup');
                        
                        // Animation des lignes de code
                        let numLines = randomIntFromInterval(5, 8); // Moins de lignes pour plus de propreté
                        for (let index = 0; index < numLines; index++) {
                            let lineLength = randomIntFromInterval(25, 90);
                            var node = document.createElement("li");
                            node.classList.add('node-' + index);
                            
                            // Injection dans le DOM
                            const ul = elem.querySelector('.code ul');
                            if(ul) {
                                ul.appendChild(node).setAttribute('style', '--linelength: ' + lineLength + '%;');

                                if (index == 0) {
                                    node.classList.add('writeLine');
                                } else {
                                    // Cascade l'animation
                                    let prevNode = ul.querySelector('.node-' + (index - 1));
                                    if(prevNode) {
                                        prevNode.addEventListener('animationend', function (e) {
                                            node.classList.add('writeLine');
                                        });
                                    } else {
                                        // Fallback si pas de prevNode
                                        setTimeout(() => node.classList.add('writeLine'), index * 100);
                                    }
                                }
                            }
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
