{% extends 'base.html' %}

{% block title %}{{ _('register_title') }} - PAYsible{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <h1 class="section-title mb-4 text-center">{{ _('register_title') }}</h1>
            <p class="text-muted text-center mb-4">
                {{ _('register_desc') }}
            </p>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" action="/register">
                <div class="mb-3">
                    <label for="email" class="form-label">{{ _('lbl_email_addr') }} *</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                        placeholder="prenom.nom@example.com"
                    >
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">{{ _('lbl_firstname') }}</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                    >
                </div>

                <div class="mb-3">
                    <label for="last_name" class="form-label">{{ _('lbl_lastname') }}</label>
                    <input
                        type="text"
                        class="form-control"
                        id="last_name"
                        name="last_name"
                    >
                </div>

                <div class="mb-3">
                    <label for="phone_number" class="form-label">{{ _('lbl_phone') }}</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="phone_number"
                            name="phone_number"
                            placeholder="+33612345678"
                            pattern="^\+[1-9][0-9]{7,14}$"
                            title="Numéro au format international, ex : +33612345678"
                        />
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">{{ _('lbl_address') }}</label>
                    <input
                        type="text"
                        class="form-control"
                        id="address"
                        name="address"
                    >
                </div>

                <button type="submit" class="btn btn-primary-paysible w-100">
                    {{ _('btn_create_my_account') }}
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login">⬅ {{ _('back_login') }}</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
