{% extends 'base.html' %}

{% block title %}Créer un compte - PAYsible{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <h1 class="section-title mb-4 text-center">Créer un compte</h1>
            <p class="text-muted text-center mb-4">
                Renseigne tes informations pour créer ton espace PAYsible.
            </p>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" action="/register">
                <div class="mb-3">
                    <label for="email" class="form-label">Adresse e-mail *</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                        placeholder="prenom.nom@example.com"
                    >
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Prénom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                    >
                </div>

                <div class="mb-3">
                    <label for="last_name" class="form-label">Nom</label>
                    <input
                        type="text"
                        class="form-control"
                        id="last_name"
                        name="last_name"
                    >
                </div>

                <div class="mb-3">
                    <label for="phone_number" class="form-label">Téléphone</label>
                    <input
                        type="text"
                        class="form-control"
                        id="phone_number"
                        name="phone_number"
                    >
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <input
                        type="text"
                        class="form-control"
                        id="address"
                        name="address"
                    >
                </div>

                <button type="submit" class="btn btn-primary-paysible w-100">
                    Créer mon compte
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login">⬅ Retour à la connexion</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
