{% extends "base.html" %}

{% block title %}Bénéficiaires - PAYsible{% endblock %}

{% block content %}
<div class="container py-5 fade-in"> 
    
    <h2 class="section-title mb-4"> 
        <i class="bi bi-people-fill"></i> Gestion des Bénéficiaires
    </h2>

    <div id="alert-container"></div>

    <div class="row">
        <div class="col-md-4">
            
            <div class="card mb-4"> 
                <div class="card-header bg-primary-paysible text-white">
                    <i class="bi bi-person-plus-fill"></i> Ajouter un bénéficiaire
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom du titulaire</label>
                        <input type="text" class="form-control" id="newName" placeholder="Ex: Maman">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">IBAN</label>
                        <input type="text" class="form-control" id="newIban" placeholder="FR76...">
                    </div>
                    <button onclick="addBeneficiary()" class="btn btn-primary-paysible w-100">
                        <i class="bi bi-check-circle"></i> Enregistrer
                    </button>
                </div>
            </div>

            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-pencil-fill"></i> Modifier
                </div>
                <div class="card-body">
                    <input type="hidden" id="updateId">
                    <div class="mb-3">
                        <label class="form-label text-muted">Nouveau Nom</label>
                        <input type="text" class="form-control" id="updateName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Nouvel IBAN</label>
                        <input type="text" class="form-control" id="updateIban">
                    </div>
                    <button onclick="updateBeneficiary()" class="btn btn-gold-paysible w-100">
                        <i class="bi bi-arrow-repeat"></i> Mettre à jour
                    </button>
                </div>
            </div>

        </div>

        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center border-bottom">
                    <span class="fw-bold text-primary-paysible">Mes Bénéficiaires enregistrés</span>
                    <button onclick="loadBeneficiaries()" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Actualiser
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light text-secondary-paysible">
                                <tr>
                                    <th>Nom</th>
                                    <th>IBAN</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="beneficiaryList">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ request.url_for('static', path='js/beneficiaries.js') }}"></script>
{% endblock %}
