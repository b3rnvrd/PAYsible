{% extends "base.html" %}

{% block title %}Bénéficiaires - PAYsible{% endblock %}

{% block content %}
<div class="container py-5 fade-in"> 
    
    <h2 class="section-title mb-4"> 
        <i class="bi bi-people-fill"></i> Gestion des Bénéficiaires
    </h2>

    <div id="alert-container"></div>

    <div class="row">
        <div class="col-md-4">
            
            <div class="card mb-4"> 
                <div class="card-header bg-primary-paysible text-white">
                    <i class="bi bi-person-plus-fill"></i> Ajouter un bénéficiaire
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nom du titulaire</label>
                        <input type="text" class="form-control" id="newName" placeholder="Ex: Maman">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">IBAN</label>
                        <input type="text" class="form-control" id="newIban" placeholder="FR76...">
                    </div>
                    <button onclick="addBeneficiary()" class="btn btn-primary-paysible w-100">
                        <i class="bi bi-check-circle"></i> Enregistrer
                    </button>
                </div>
            </div>

            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-pencil-fill"></i> Modifier
                </div>
                <div class="card-body">
                    <input type="hidden" id="updateId">
                    <div class="mb-3">
                        <label class="form-label text-muted">Nouveau Nom</label>
                        <input type="text" class="form-control" id="updateName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Nouvel IBAN</label>
                        <input type="text" class="form-control" id="updateIban">
                    </div>
                    <button onclick="updateBeneficiary()" class="btn btn-gold-paysible w-100">
                        <i class="bi bi-arrow-repeat"></i> Mettre à jour
                    </button>
                </div>
            </div>

        </div>

        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center border-bottom">
                    <span class="fw-bold text-primary-paysible">Mes Bénéficiaires enregistrés</span>
                    <button onclick="loadBeneficiaries()" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise"></i> Actualiser
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light text-secondary-paysible">
                                <tr>
                                    <th>Nom</th>
                                    <th>IBAN</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="beneficiaryList">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const API_URL = "/api/beneficiaries/";

    // --- Fonction utilitaire pour afficher les erreurs sur le site ---
    function showError(message, type="danger") {
        const container = document.getElementById('alert-container');
        container.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
        // Scroll vers le message pour être sûr qu'il est vu
        container.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- GET ---
    async function loadBeneficiaries() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) return;
            const data = await response.json();
            const listElement = document.getElementById('beneficiaryList');
            listElement.innerHTML = "";

            data.forEach(b => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-dark">${b.name}</td>
                    <td class="font-monospace text-muted small">${b.iban}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="prefillUpdate(${b.id}, '${b.name}', '${b.iban}')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteBeneficiary(${b.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                listElement.appendChild(tr);
            });
        } catch (e) {
            console.error("Erreur chargement", e);
        }
    }

    // --- POST ---
    async function addBeneficiary() {
        // Nettoyer les anciennes erreurs
        document.getElementById('alert-container').innerHTML = "";

        const name = document.getElementById('newName').value;
        const iban = document.getElementById('newIban').value;
        
        if(!name || !iban) {
            return showError("Veuillez remplir tous les champs (Nom et IBAN).", "warning");
        }

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, iban })
        });

        if (response.ok) {
            document.getElementById('newName').value = "";
            document.getElementById('newIban').value = "";
            loadBeneficiaries();
            showError("Bénéficiaire ajouté avec succès !", "success");
        } else {
            const errorData = await response.json();
            let msg = "Impossible d'ajouter le bénéficiaire.";

            if (response.status === 422 && errorData.detail) {
                // Erreur de validation (Format IBAN)
                msg = errorData.detail[0].msg.replace('Value error, ', '');
            } else if (errorData.detail) {
                // Erreur métier (Doublon)
                msg = errorData.detail;
            }
            showError(msg);
        }
    }

    // --- PATCH ---
    async function updateBeneficiary() {
        document.getElementById('alert-container').innerHTML = "";
        
        const id = document.getElementById('updateId').value;
        if(!id) return showError("Sélectionnez un bénéficiaire dans la liste d'abord", "warning");
        
        const name = document.getElementById('updateName').value;
        const iban = document.getElementById('updateIban').value;

        const response = await fetch(API_URL + id + "/", {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, iban })
        });
        
        if (response.ok) {
            loadBeneficiaries();
            document.getElementById('updateId').value = "";
            document.getElementById('updateName').value = "";
            document.getElementById('updateIban').value = "";
            showError("Modification enregistrée.", "success");
        } else {
            const errorData = await response.json();
            let msg = errorData.detail;
            if (response.status === 422 && errorData.detail[0]) {
                msg = errorData.detail[0].msg.replace('Value error, ', '');
            }
            showError(msg);
        }
    }

    // --- DELETE ---
    async function deleteBeneficiary(id) {
        if(!confirm("Supprimer ce bénéficiaire ?")) return;
        await fetch(API_URL + id + "/", { method: 'DELETE' });
        loadBeneficiaries();
    }

    function prefillUpdate(id, name, iban) {
        document.getElementById('updateId').value = id;
        document.getElementById('updateName').value = name;
        document.getElementById('updateIban').value = iban;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // On nettoie les alertes précédentes pour ne pas embrouiller l'utilisateur
        document.getElementById('alert-container').innerHTML = "";
    }

    document.addEventListener("DOMContentLoaded", loadBeneficiaries);
</script>
{% endblock %}
