services:
  web:
    build: .
    container_name: paysible_container
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Force uvicorn à bien détecter les changements de fichiers dans Docker
      - WATCHFILES_FORCE_POLLING=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload