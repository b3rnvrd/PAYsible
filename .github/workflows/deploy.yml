name: Deploy with Docker

on:
  push:
    branches: [ "main" ]

# Permissions nécessaires pour pousser l'image sur GitHub
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # L'image s'appellera ghcr.io/votre-pseudo/paysible:latest
          tags: ghcr.io/${{ github.repository_owner }}/paysible:latest

